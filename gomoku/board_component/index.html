<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;font-family:system-ui,sans-serif}canvas{width:100%;max-width:660px;display:block;margin:auto;border-radius:16px;touch-action:manipulation;outline:none}#status{position:absolute;width:1px;height:1px;overflow:hidden}
</style></head><body><canvas id="board" width="660" height="660" tabindex="0" aria-label="15 곱하기 15 오목판. 마우스로 교차점을 클릭하거나 방향키로 이동하고 Enter로 착수하세요."></canvas><div id="status" aria-live="polite"></div>
<script>
const canvas=document.getElementById('board'), ctx=canvas.getContext('2d');let args={},focus=[7,7],seq=0,pending=null;const p=43,s=41;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let audio=null,lastSoundCount=0,soundGame=null;
function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function stoneSound(){if(!args.sound||!audio||audio.state!=='running')return;const n=Math.floor(audio.sampleRate*.065),buffer=audio.createBuffer(1,n,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.009));const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1800;filter.Q.value=.7;gain.gain.value=.42;source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start();}
function draw(){ctx.clearRect(0,0,660,660);ctx.fillStyle='#dfbd88';ctx.fillRect(0,0,660,660);ctx.strokeStyle='#907649';ctx.lineWidth=1;
for(let i=0;i<15;i++){let v=p+i*s;ctx.beginPath();ctx.moveTo(p,v);ctx.lineTo(p+14*s,v);ctx.moveTo(v,p);ctx.lineTo(v,p+14*s);ctx.stroke();ctx.fillStyle='#635033';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(String.fromCharCode(65+i),v,23);ctx.fillText(String(i+1),22,v+4);}
for(const [x,y] of [[3,3],[3,11],[7,7],[11,3],[11,11]]){ctx.beginPath();ctx.arc(p+x*s,p+y*s,3,0,7);ctx.fill();}
const moves=pending?[...(args.moves||[]),pending]:(args.moves||[]);
moves.forEach(([x,y],i)=>{const cx=p+x*s,cy=p+y*s;ctx.beginPath();ctx.arc(cx,cy,17,0,7);ctx.fillStyle=i%2?'#fffdf6':'#20352d';ctx.fill();ctx.strokeStyle=i%2?'#b7aa91':'#16271f';ctx.stroke();if(args.numbers){ctx.fillStyle=i%2?'#20352d':'#fff';ctx.font='12px system-ui';ctx.fillText(String(i+1),cx,cy+4);}else if(i===moves.length-1){ctx.beginPath();ctx.arc(cx,cy,4,0,7);ctx.fillStyle='#ea9350';ctx.fill();}});
if(args.guide&&!pending){for(const line of args.lines||[]){if(line.points.length<2)continue;const ps=line.points;ctx.beginPath();ctx.moveTo(p+ps[0][0]*s,p+ps[0][1]*s);ctx.lineTo(p+ps.at(-1)[0]*s,p+ps.at(-1)[1]*s);ctx.strokeStyle=line.color===1?'#f28c45':'#3a8bd8';ctx.lineWidth=5;ctx.globalAlpha=.7;ctx.stroke();ctx.globalAlpha=1;}
(args.guides||[]).forEach((g,i)=>{const [x,y]=g.point;ctx.beginPath();ctx.arc(p+x*s,p+y*s,15,0,7);ctx.fillStyle=g.kind==='defense'?'#2878bb':'#cb6c2d';ctx.fill();ctx.fillStyle='white';ctx.font='bold 15px system-ui';ctx.fillText(String(i+1),p+x*s,p+y*s+5);});}
}
function move(x,y){unlockAudio();if(args.disabled||pending||x<0||x>14||y<0||y>14)return;if(!(args.moves||[]).some(([a,b])=>a===x&&b===y)){pending=[x,y];lastSoundCount=(args.moves||[]).length+1;stoneSound();draw();}send('streamlit:setComponentValue',{value:{x,y,position:args.position,event:Date.now()+'-'+(++seq)},dataType:'json'});}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();const x=Math.round(((e.clientX-r.left)*660/r.width-p)/s),y=Math.round(((e.clientY-r.top)*660/r.height-p)/s);move(x,y);});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')focus[0]=Math.max(0,focus[0]-1);if(e.key==='ArrowRight')focus[0]=Math.min(14,focus[0]+1);if(e.key==='ArrowUp')focus[1]=Math.max(0,focus[1]-1);if(e.key==='ArrowDown')focus[1]=Math.min(14,focus[1]+1);if(e.key==='Enter'||e.key===' ')move(...focus);document.getElementById('status').textContent=String.fromCharCode(65+focus[0])+(focus[1]+1);draw();});
canvas.addEventListener('focus',draw);canvas.addEventListener('blur',draw);
addEventListener('message',e=>{if(e.data.type==='streamlit:render'){args=e.data.args;const count=(args.moves||[]).length;if(soundGame===args.game_id&&count>lastSoundCount)stoneSound();soundGame=args.game_id;lastSoundCount=count;pending=null;draw();send('streamlit:setFrameHeight',{height:Math.min(innerWidth,660)});}});addEventListener('resize',()=>send('streamlit:setFrameHeight',{height:Math.min(innerWidth,660)}));send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
